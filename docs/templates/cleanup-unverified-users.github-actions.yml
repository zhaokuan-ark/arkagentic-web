name: Cleanup unverified Supabase users

on:
  schedule:
    - cron: "17 16 * * *" # 03:17 Australia/Sydney during AEDT, 02:17 during AEST
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Delete unverified users older than this many hours"
        required: false
        default: "48"
      apply:
        description: "Set to true to delete users; false runs a dry run"
        required: false
        default: "false"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cleanup stale unverified users
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNVERIFIED_USER_MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '48' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.apply }}" != "true" ]; then
            npm run auth:cleanup-unverified
          else
            npm run auth:cleanup-unverified -- --apply
          fi
